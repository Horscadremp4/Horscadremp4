<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HORS CADRE — Portfolio</title>
<meta name="description" content="Hors Cadre — vidéaste à Bordeaux. Films de marque, clips, mariages, formats courts.">
<style>
  :root{
    --bg:#0a0a0a; --fg:#f4f4f2; --muted:#8c8c88; --line:#232323; --red:#e11d2e;
    --pad:clamp(16px,4vw,48px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  /* barre du haut */
  header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
    padding:14px var(--pad);background:rgba(10,10,10,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .logo{font-weight:800;letter-spacing:.12em;font-size:15px;display:flex;align-items:center;gap:10px}
  .logo .box{border:2px solid var(--fg);padding:1px 6px}
  .rec{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.2em;color:var(--muted)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.15}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}

  /* intro */
  .hero{padding:clamp(56px,12vw,140px) var(--pad) clamp(32px,6vw,72px);max-width:1400px;margin:0 auto}
  .hero h1{font-size:clamp(44px,11vw,150px);line-height:.92;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
  .hero h1 span{color:var(--red)}
  .hero p{margin-top:28px;max-width:560px;color:var(--muted);font-size:clamp(15px,1.6vw,18px)}
  .cta{display:inline-block;margin-top:28px;border:1px solid var(--fg);padding:12px 22px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;transition:.2s}
  .cta:hover{background:var(--fg);color:var(--bg)}

  /* grille */
  .section-title{max-width:1400px;margin:0 auto;padding:0 var(--pad);font-size:12px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-bottom:18px}
  .grid{max-width:1400px;margin:0 auto;padding:0 var(--pad) 80px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:560px){.grid{grid-template-columns:1fr}}
  .card{position:relative;display:block;text-align:left;background:none;border:0;color:inherit;cursor:pointer;font:inherit}
  .thumb{position:relative;aspect-ratio:16/9;background:#161616;overflow:hidden;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05);transition:filter .35s,transform .6s}
  .card:hover .thumb img,.card:focus-visible .thumb img{filter:none;transform:scale(1.04)}
  .card:focus-visible{outline:2px solid var(--red);outline-offset:4px}
  .num{position:absolute;top:10px;left:12px;font-size:12px;letter-spacing:.2em;color:#fff;mix-blend-mode:difference}
  .play{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;border:1px solid #fff;display:grid;place-items:center;opacity:0;transition:.25s;background:rgba(0,0,0,.35)}
  .card:hover .play,.card:focus-visible .play{opacity:1}
  .play::after{content:"";border-left:12px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
  @media (hover:none){.play{opacity:1}}
  .meta{padding:12px 2px 0}
  .meta h3{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .meta h3 b{color:var(--red);font-weight:800}
  .meta p{font-size:13px;color:var(--muted);margin-top:2px}

  /* lecteur */
  dialog{border:0;background:transparent;max-width:min(1100px,94vw);width:100%;padding:0;margin:auto;color:var(--fg)}
  dialog::backdrop{background:rgba(0,0,0,.92)}
  .player{background:#000;border:1px solid var(--line)}
  .player iframe{width:100%;height:min(78vh,720px);display:block;border:0;background:#000}
  .player-bar a{border-bottom:1px solid var(--fg);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding-bottom:2px}
  .player-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 14px}
  .player-bar strong{font-size:14px;letter-spacing:.08em;text-transform:uppercase}
  .close{background:none;border:1px solid var(--fg);color:var(--fg);padding:8px 14px;font-size:12px;letter-spacing:.18em;cursor:pointer;text-transform:uppercase}
  .close:hover{background:var(--fg);color:var(--bg)}

  /* contact */
  footer{border-top:1px solid var(--line);padding:clamp(40px,8vw,90px) var(--pad);max-width:1400px;margin:0 auto}
  footer h2{font-size:clamp(28px,6vw,72px);font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
  footer h2 span{color:var(--red)}
  footer .links{margin-top:22px;display:flex;flex-wrap:wrap;gap:24px;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
  footer .links a{border-bottom:1px solid var(--fg);padding-bottom:3px}
  footer small{display:block;margin-top:50px;color:var(--muted);font-size:12px}
</style>
</head>
<body>

<header>
  <a class="logo" href="#top" aria-label="Hors Cadre"><span>HORS</span><span class="box">&nbsp;</span></a>
  <span class="rec"><span class="dot"></span>REC</span>
</header>

<main id="top">
  <section class="hero">
    <h1>Hors<br><span>[</span> Cadre <span>]</span></h1>
    <!-- À MODIFIER : ta phrase de présentation -->
    <p>Vidéaste basé à Bordeaux. Films de marque, clips, mariages et formats courts : on filme ce qui sort du cadre.</p>
    <a class="cta" href="#travaux">Voir les réalisations</a>
  </section>

  <p class="section-title" id="travaux">Réalisations — <span id="count"></span></p>
  <section class="grid" id="grid" aria-label="Réalisations"></section>
</main>

<footer id="contact">
  <h2>Un projet ? <span>Parlons-en.</span></h2>
  <div class="links">
    <!-- À MODIFIER : tes liens -->
    <a href="https://www.instagram.com/horscadre.mp4" target="_blank" rel="noopener">Instagram @horscadre.mp4</a>
    <a href="mailto:ton@email.com">ton@email.com</a>
  </div>
  <small>© <span id="year"></span> Hors Cadre</small>
</footer>

<dialog id="dlg" aria-label="Lecteur vidéo">
  <div class="player">
    <iframe id="vid" title="Vidéo Instagram" loading="lazy" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
    <div class="player-bar">
      <strong id="vtitle"></strong>
      <a id="vlink" href="#" target="_blank" rel="noopener">Voir sur Instagram ↗</a>
      <button class="close" id="close">Fermer ✕</button>
    </div>
  </div>
</dialog>

<script>
/* ============================================================
   À MODIFIER : tes 9 réalisations.
   - frame  : image d'aperçu (jpg) dans media/frames/
   - insta  : lien du post ou du reel Instagram (copie-le depuis Instagram :
              "..." > Copier le lien). Les descriptions restent sur Instagram.
   - word   : le mot affiché dans « HORS [ MOT ] »
   - client / type : les petits textes sous le titre
   ============================================================ */
const PROJECTS = [
  { word:"CAFÉ",     client:"The Base",              type:"Film de marque",  frame:"media/frames/01.jpg", insta:"https://www.instagram.com/reel/COLLE_LE_CODE/" },
  { word:"LAB",      client:"Le Lab 121 × Lionel",   type:"Collaboration",   frame:"media/frames/02.jpg", insta:"https://www.instagram.com/reel/COLLE_LE_CODE/" },
  { word:"FOLIE",    client:"La Belle en Folie",     type:"Film de marque",  frame:"media/frames/03.jpg", insta:"https://www.instagram.com/reel/COLLE_LE_CODE/" },
  { word:"CLIP",     client:"Marcelino",             type:"Clip",            frame:"media/frames/04.jpg", insta:"https://www.instagram.com/reel/COLLE_LE_CODE/" },
  { word:"ATHLÈTE",  client:"Portrait",              type:"Portrait",        frame:"media/frames/05.jpg", insta:"https://www.instagram.com/reel/COLLE_LE_CODE/" },
  { word:"JMAK",     client:"Alvin Jmak",            type:"Collaboration",   frame:"media/frames/06.jpg", insta:"https://www.instagram.com/reel/COLLE_LE_CODE/" },
  { word:"OUI",      client:"Mariage Gloire",        type:"Mariage",         frame:"media/frames/07.jpg", insta:"https://www.instagram.com/reel/COLLE_LE_CODE/" },
  { word:"TRUTH",    client:"Réouverture TRUTH",     type:"Teaser IA",       frame:"media/frames/08.jpg", insta:"https://www.instagram.com/reel/COLLE_LE_CODE/" },
  { word:"STUDIO",   client:"Récap studio",          type:"Récap",           frame:"media/frames/09.jpg", insta:"https://www.instagram.com/reel/COLLE_LE_CODE/" }
];

const grid = document.getElementById('grid');
const dlg  = document.getElementById('dlg');
const vid  = document.getElementById('vid');
const vtitle = document.getElementById('vtitle');
const vlink = document.getElementById('vlink');

document.getElementById('count').textContent = PROJECTS.length + " films";
document.getElementById('year').textContent = new Date().getFullYear();

PROJECTS.forEach((p, i) => {
  const n = String(i + 1).padStart(2, '0');
  const b = document.createElement('button');
  b.className = 'card';
  b.type = 'button';
  b.setAttribute('aria-label', 'Lire : HORS ' + p.word + ' — ' + p.client);
  b.innerHTML =
    '<div class="thumb">' +
      '<img src="' + p.frame + '" alt="Frame du film ' + p.client + '" loading="lazy" onerror="this.style.display=\'none\'">' +
      '<span class="num">' + n + '</span><span class="play"></span>' +
    '</div>' +
    '<div class="meta"><h3>HORS <b>[</b> ' + p.word + ' <b>]</b></h3><p>' + p.client + ' · ' + p.type + '</p></div>';
  b.addEventListener('click', () => open(p));
  grid.appendChild(b);
});

function embedUrl(u){
  // transforme le lien du post en lien d'intégration
  const m = u.match(/instagram\.com\/(reel|reels|p|tv)\/([A-Za-z0-9_-]+)/);
  if(!m) return null;
  const kind = (m[1] === 'reels') ? 'reel' : m[1];
  return 'https://www.instagram.com/' + kind + '/' + m[2] + '/embed';
}
function open(p){
  vtitle.textContent = 'HORS [ ' + p.word + ' ] — ' + p.client;
  vlink.href = p.insta;
  const e = embedUrl(p.insta);
  if(!e){ window.open(p.insta, '_blank', 'noopener'); return; }   // lien non reconnu : on ouvre Instagram
  vid.src = e;
  dlg.showModal();
}
function closeDlg(){ vid.removeAttribute('src'); dlg.close(); }
document.getElementById('close').addEventListener('click', closeDlg);
dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });
dlg.addEventListener('cancel', e => { e.preventDefault(); closeDlg(); });
</script>
</body>
</html>
